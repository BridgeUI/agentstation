# agentstation のログローテーション（docs/spec.md 3.2「ディスク・ログ」）。50MB × 5 世代、bzip2 圧縮。
# 置換: __USER__ → その環境のユーザー名
# 配置: sudo install -m 0644 -o root -g wheel agentstation.conf /etc/newsyslog.d/agentstation.conf
# 確認: sudo newsyslog -nvv   （-n は dry run。対象のファイルと判定が出る）
# 書式: logfilename  owner:group  mode  count  size(KB)  when  flags
#   size 51200 = 50MB。when の * は「サイズだけで判定」。J = bzip2、N = プロセスにシグナルを送らない、
#   C = 無ければ作る。newsyslog は launchd（com.apple.newsyslog）が 30 分ごとに動かす。
#
# 注意（要確認）: newsyslog はファイルをリネームして新しいファイルを作る方式なので、ファイルを開いたままの
# プロセス（launchd の StandardOutPath、claude の --debug-file）はローテーション後も古いファイルに書き続ける。
# 次にそのプロセスが再起動したとき（夜間メンテナンスの RC 再起動、エージェントの kickstart）から新しい
# ファイルに切り替わる。cloudflared はローテーションで止めないため、大きくなり続けるようなら
# config.yml の logfile 指定と loglevel の見直しを検討する（cloudflare/ 参照）。

# ---- 各環境（host / vm1 / vm2）共通 ----
/Users/__USER__/Library/Logs/claude-rc.log            __USER__:staff  644  5  51200  *  JNC
/Users/__USER__/Library/Logs/claude-rc.out.log        __USER__:staff  644  5  51200  *  JNC
/Users/__USER__/Library/Logs/claude-rc.err.log        __USER__:staff  644  5  51200  *  JNC
# フォルダを選んで起動した Remote Control のログ（claude-rc-<フォルダ名>.log。G はパターン指定）
/Users/__USER__/Library/Logs/claude-rc-*.log          __USER__:staff  644  5  51200  *  JNG
/Users/__USER__/Library/Logs/agentstation/out.log    __USER__:staff  644  5  51200  *  JNC
/Users/__USER__/Library/Logs/agentstation/err.log    __USER__:staff  644  5  51200  *  JNC
/Users/__USER__/Library/Logs/codex.out.log            __USER__:staff  644  5  51200  *  JN
/Users/__USER__/Library/Logs/codex.err.log            __USER__:staff  644  5  51200  *  JN

# ---- host だけ（VM に置くときはこの下を消す） ----
/Library/Logs/cloudflared/cloudflared.out.log         root:wheel      644  5  51200  *  JNC
/Library/Logs/cloudflared/cloudflared.err.log         root:wheel      644  5  51200  *  JNC
/Users/__USER__/Library/Logs/agentstation-vm/vm1.out.log   __USER__:staff  644  5  51200  *  JNC
/Users/__USER__/Library/Logs/agentstation-vm/vm1.err.log   __USER__:staff  644  5  51200  *  JNC
/Users/__USER__/Library/Logs/agentstation-vm/vm2.out.log   __USER__:staff  644  5  51200  *  JNC
/Users/__USER__/Library/Logs/agentstation-vm/vm2.err.log   __USER__:staff  644  5  51200  *  JNC
