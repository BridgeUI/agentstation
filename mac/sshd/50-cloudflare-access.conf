# Cloudflare Access の短期証明書で SSH を受ける（docs/spec.md 8.2）。host / vm1 / vm2 すべてに置く。
# 配置: sudo install -m 0644 -o root -g wheel 50-cloudflare-access.conf /etc/ssh/sshd_config.d/50-cloudflare-access.conf
# 前提: /etc/ssh/sshd_config の先頭に「Include /etc/ssh/sshd_config.d/*」があること（macOS 13 以降。要確認: grep Include /etc/ssh/sshd_config）。
#       sshd は最初に一致した設定を使うので、Include される断片が既定より優先される。
# 検証: sudo sshd -t （何も出なければ OK）→ sudo sshd -T | grep -i -E 'trusteduserca|pubkeyauth'
# 反映: macOS の sshd は接続ごとに launchd が起動するので再起動不要の見込み（要確認）。読み直さなければ
#       sudo launchctl kickstart -k system/com.openssh.sshd（cloudflare/access/setup.md 5-2）。SSH で入ったまま実行すると切れる。
#
# ca.pub は Cloudflare Zero Trust の SSH CA 公開鍵。取り方と置き方は cloudflare/access/setup.md 5章。
#   - 経路 A（ブラウザ版 SSH）はアプリごとの CA：このマシン用の 1 本だけ（host は ssh-host、vm1 は ssh-vm1、vm2 は ssh-vm2）
#   - 経路 B（WARP、Access for Infrastructure）は Gateway SSH CA：3 台とも同じ 1 本
#   - 1 行 1 鍵で 2 行書く。sudo install -m 0644 -o root -g wheel ca.pub /etc/ssh/ca.pub
# 証明書のプリンシパル = Access のメールの @ より前 = ログインユーザー名（taro / hanako / jiro）。一致しないと入れない。
# 鍵交換方式はブラウザ版が使う curve25519-sha256 などが macOS の既定に含まれる（cloudflare/access/setup.md 4章）。
# 通らなければ KexAlgorithms をここに足す（要確認: docs/verify.md D-5）。

TrustedUserCAKeys /etc/ssh/ca.pub
PubkeyAuthentication yes

# 下の 2 行は「証明書で入れることを確認してから」コメントを外す（先に切ると締め出される。
# その場合は画面共有か実機で戻す）。確認が済んだら有効にして sudo sshd -t。
#PasswordAuthentication no
#KbdInteractiveAuthentication no
